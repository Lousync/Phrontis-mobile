<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会话历史原型 · DeepSeek 模式 + 收藏</title>
<style>
  :root {
    --bg: #1e1e1e; --surface: #252526; --surface2: #2d2d2d;
    --border: rgba(255,255,255,.09); --border-soft: rgba(255,255,255,.06);
    --text: #d4d4d4; --muted: #8a8a8a; --accent: #007acc;
    --gold: #d7a94b; --red: #e24b4a; --green: #4a9e6a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: #141414; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: var(--text); display: flex; justify-content: center; padding: 24px 12px; min-height: 100vh; }
  .note { max-width: 430px; color: var(--muted); font-size: 12px; line-height: 1.7; margin: 0 auto 18px; }
  .note b { color: var(--text); font-weight: 500; }
  .phone { position: relative; width: 390px; height: 780px; background: var(--bg); border-radius: 28px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 24px 70px rgba(0,0,0,.5); }
  .pg { padding: 26px 20px 0; display: flex; flex-direction: column; height: 100%; }
  .pg-head { display: flex; align-items: center; gap: 10px; }
  .pg-head .t { font-size: 26px; font-weight: 700; letter-spacing: .3px; }
  .pg-head .sub { font-size: 12px; color: var(--muted); padding-bottom: 4px; }
  .seg { margin-left: auto; display: flex; background: var(--surface); border-radius: 17px; padding: 3px; gap: 2px; }
  .seg button { border: none; background: none; color: var(--muted); font-size: 12px; padding: 6px 12px; border-radius: 14px; cursor: pointer; }
  .seg button.on { background: var(--surface2); color: var(--text); }
  .clock { border: none; background: none; color: var(--muted); cursor: pointer; padding: 6px; margin-left: 2px; }
  .clock:hover { color: var(--text); }
  .chat { flex: 1; overflow-y: auto; padding: 18px 2px; }
  .bubble { background: var(--surface); border: 1px solid var(--border-soft); border-radius: 4px 16px 16px 16px; padding: 13px 15px; font-size: 13.5px; line-height: 1.7; max-width: 92%; }
  .bubble b { font-weight: 600; color: #eaeaea; }
  .chat .cur-tag { font-size: 11px; color: var(--muted); margin-top: 10px; }
  .input-bar { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 10px 14px; margin-bottom: 12px; color: var(--muted); font-size: 14px; }
  .input-bar .send { margin-left: auto; width: 34px; height: 34px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .dock { display: flex; justify-content: space-around; background: rgba(37,37,38,.92); border: 1px solid var(--border); border-radius: 26px; padding: 10px 8px; margin-bottom: 14px; }
  .dock button { border: none; background: none; color: var(--muted); font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 4px 14px; border-radius: 16px; }
  .dock button.on { background: var(--surface2); color: var(--text); }
  .backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .22s; z-index: 40; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  /* 侧边抽屉：从左滑入（DeepSeek 移动端同款），全高、右侧圆角 */
  .drawer { position: absolute; top: 0; left: -105%; bottom: 0; z-index: 41; width: min(312px, 84%); background: var(--surface); border-right: 1px solid var(--border); border-radius: 0 22px 22px 0; padding: 18px 14px 20px; transition: left .3s cubic-bezier(.32,.72,.28,1); display: flex; flex-direction: column; }
  .drawer.open { left: 0; }
  .drawer-head { display: flex; align-items: center; margin-bottom: 12px; flex: none; }
  .drawer-head .dt { font-size: 16px; font-weight: 600; }
  .drawer-head .close { margin-left: auto; border: none; background: none; color: var(--muted); cursor: pointer; font-size: 17px; padding: 4px 8px; border-radius: 9px; }
  .drawer-head .close:hover { color: var(--text); background: rgba(255,255,255,.07); }
  .grip { width: 38px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); margin: 4px auto 12px; flex: none; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border-soft); border-radius: 11px; padding: 9px 12px; flex: none; }
  .search input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 14px; }
  .search input::placeholder { color: var(--muted); }
  .new-btn { flex: none; margin: 10px 0 4px; width: 100%; border: 1px dashed var(--border); background: none; color: var(--text); font-size: 13px; padding: 10px; border-radius: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; }
  .new-btn:hover { border-color: var(--accent); color: var(--accent); }
  .list { overflow-y: auto; margin-top: 6px; scrollbar-width: thin; scrollbar-color: #3a3a3a transparent; }
  .g-head { font-size: 11.5px; color: var(--muted); letter-spacing: 1px; padding: 14px 2px 7px; position: sticky; top: -6px; background: var(--surface); }
  .g-head .cnt { color: rgba(255,255,255,.25); margin-left: 6px; }
  .row { display: flex; align-items: center; gap: 9px; padding: 11px 10px; border-radius: 12px; cursor: pointer; position: relative; }
  .row:hover { background: var(--surface2); }
  .row.cur { background: var(--surface2); }
  .row.cur::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--accent); }
  .star { flex: none; width: 16px; text-align: center; font-size: 13px; color: rgba(255,255,255,.14); cursor: pointer; line-height: 1; }
  .star.on { color: var(--gold); }
  .title { flex: 1; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more { flex: none; border: none; background: none; color: var(--muted); cursor: pointer; padding: 4px 6px; border-radius: 8px; font-size: 15px; line-height: 1; }
  .more:hover { color: var(--text); background: rgba(255,255,255,.07); }
  .acts { display: flex; gap: 6px; margin-left: auto; }
  .acts button { border: none; background: rgba(255,255,255,.08); color: var(--text); font-size: 12px; padding: 6px 11px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
  .acts button:hover { background: rgba(255,255,255,.14); }
  .acts button.danger { color: var(--red); }
  .acts button.gold { color: var(--gold); }
  .acts button.on { background: rgba(215,169,75,.16); color: var(--gold); }
  .rename-box { flex: 1; display: flex; gap: 8px; }
  .rename-box input { flex: 1; background: var(--bg); border: 1px solid var(--accent); border-radius: 9px; padding: 7px 10px; font-size: 13px; color: var(--text); outline: none; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 36px 0; }
  .flash { animation: flash .5s; }
  @keyframes flash { 0% { background: rgba(0,122,204,.22); } 100% { background: transparent; } }
</style>
</head>
<body>
<div style="width:430px">
  <div class="note"><b>会话历史 · DeepSeek 模式原型（侧边抽屉版）</b> —— 点右上角时钟打开，抽屉从<b>左侧</b>滑入、全高。看点：搜索常驻 + 收藏分组（星标直点）+ ⋯/长按呼出操作条（收藏·置顶·重命名·删除）。</div>
  <div class="phone" id="phone">
    <div class="pg">
      <div class="pg-head">
        <span class="t">AI 助手</span>
        <span class="sub">未配对电脑 · 点此去设置</span>
        <div class="seg"><button class="on">手机直连</button><button>电脑 AI</button></div>
        <button class="clock" id="clockBtn" title="会话历史">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        </button>
      </div>
      <div class="chat" id="chat"></div>
      <div class="input-bar"><span>🎙</span>问点什么…<span class="send">➤</span></div>
      <div class="dock">
        <button class="on">✦<span>AI</span></button><button>📅<span>日程</span></button><button>💰<span>记账</span></button><button>📖<span>笔记</span></button><button>⚙️<span>设置</span></button>
      </div>
    </div>
    <div class="backdrop" id="backdrop"></div>
    <div class="drawer" id="sheet">
      <div class="drawer-head"><span class="dt">会话历史</span><button class="close" onclick="closeSheet()">✕</button></div>
      <div class="search"><span style="color:var(--muted);font-size:13px">🔍</span><input id="kw" placeholder="搜索会话"></div>
      <button class="new-btn" id="newBtn">＋ 开启新对话</button>
      <div class="list" id="list"></div>
    </div>
  </div>
</div>
<script>
  const now = Date.now(), H = 3600e3, D = 24 * H;
  let cur = 's1';
  let sessions = [
    { id: 's1', title: '帮我看看这个月的餐饮支出', ts: now - 2 * H, pinned: false, fav: true },
    { id: 's2', title: '周五下午 3 点和产品对需求，排到日程', ts: now - 5 * H, pinned: false, fav: false },
    { id: 's3', title: '把这段读书笔记存到「认知科学」', ts: now - 9 * H, pinned: false, fav: false },
    { id: 's4', title: '昨天记的那笔报销是多少来着', ts: now - 1 * D - 3 * H, pinned: false, fav: false },
    { id: 's5', title: '周报草稿：同步引擎这周干了啥', ts: now - 2 * D, pinned: false, fav: true },
    { id: 's6', title: '欠条：下周一提醒我还书', ts: now - 6 * D, pinned: false, fav: false },
    { id: 's7', title: 'Ollama 本地跑 qwen 有多慢', ts: now - 12 * D, pinned: false, fav: false },
    { id: 's8', title: '★常驻：日常记账快捷指令', ts: now - 30 * D, pinned: true, fav: true },
  ];
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const groupKey = ts => { const d = now - ts; return d < D ? 'today' : d < 2 * D ? 'yesterday' : d < 7 * D ? 'd7' : d < 30 * D ? 'd30' : 'older' };
  const groupLabel = { pin: '置顶', fav: '收藏', today: '今天', yesterday: '昨天', d7: '7 天内', d30: '30 天内', older: '更早' };

  let menuId = null, renameId = null, armedId = null, renameVal = '';
  const resetModes = () => { menuId = renameId = armedId = null };

  function renderChat(flashTitle) {
    const s = sessions.find(x => x.id === cur);
    $('chat').innerHTML = `<div class="bubble">早上好。手机端就我一个 AI，<b>记账、改日程、写笔记</b>都找我 —— 点左下角麦克风说一句，或直接打字。</div><div class="cur-tag">当前会话：${esc(s ? s.title : '—')}</div>`;
  }
  function openSheet() { $('backdrop').classList.add('open'); $('sheet').classList.add('open'); $('kw').value = ''; renderList(); }
  function closeSheet() { $('backdrop').classList.remove('open'); $('sheet').classList.remove('open'); resetModes(); }
  $('clockBtn').onclick = openSheet;
  $('backdrop').onclick = closeSheet;
  $('kw').oninput = () => renderList();
  $('newBtn').onclick = () => { const s = { id: 's' + Date.now(), title: '新对话 ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }), ts: now, pinned: false, fav: false }; sessions.unshift(s); cur = s.id; resetModes(); renderList(); renderChat(); };

  function rowHtml(s) {
    if (s.id === renameId) return `<div class="row cur"><div class="rename-box"><input id="rn" value="${esc(renameVal)}" autofocus><div class="acts"><button onclick="doRename('${s.id}')">保存</button><button onclick="reset();renderList()">取消</button></div></div></div>`;
    if (s.id === armedId) return `<div class="row cur"><span class="title" style="color:var(--red)">删除这条会话？</span><div class="acts"><button class="danger" onclick="doDelete('${s.id}')">删除</button><button onclick="reset();renderList()">取消</button></div></div>`;
    if (s.id === menuId) return `<div class="row cur"><span class="title">${esc(s.title)}</span><div class="acts"><button class="${s.fav ? 'gold on' : 'gold'}" onclick="toggleFav('${s.id}')">${s.fav ? '★ 已收藏' : '☆ 收藏'}</button><button class="${s.pinned ? 'on' : ''}" onclick="togglePin('${s.id}')">${s.pinned ? '已置顶' : '置顶'}</button><button onclick="startRename('${s.id}')">重命名</button><button class="danger" onclick="arm('${s.id}')">删除</button></div></div>`;
    return `<div class="row${s.id === cur ? ' cur' : ''}" data-id="${s.id}" onclick="rowClick('${s.id}')" onpointerdown="lpStart('${s.id}')" onpointerup="lpCancel()" onpointermove="lpCancel()">
      <span class="star${s.fav ? ' on' : ''}" onclick="event.stopPropagation();toggleFav('${s.id}')">${s.fav ? '★' : '☆'}</span>
      <span class="title">${esc(s.title)}</span>
      ${s.pinned ? '<span style="font-size:10px;color:var(--accent);flex:none">置顶</span>' : ''}
      <button class="more" onclick="event.stopPropagation();reset();menuId='${s.id}';renderList()">⋯</button></div>`;
  }
  function renderList() {
    const kw = $('kw').value.trim().toLowerCase();
    const sorted = [...sessions].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.ts - a.ts);
    let html = '';
    if (kw) {
      const hits = sorted.filter(s => s.title.toLowerCase().includes(kw));
      html = hits.length ? hits.map(rowHtml).join('') : '<div class="empty">没有匹配的会话</div>';
    } else {
      for (const g of ['pin', 'fav', 'today', 'yesterday', 'd7', 'd30', 'older']) {
        const items = sorted.filter(s => g === 'pin' ? s.pinned : g === 'fav' ? (s.fav && !s.pinned) : (!s.pinned && !s.fav && groupKey(s.ts) === g));
        if (!items.length) continue;
        html += `<div class="g-head">${groupLabel[g]}<span class="cnt">${items.length}</span></div>` + items.map(rowHtml).join('');
      }
      if (!html) html = '<div class="empty">还没有会话</div>';
    }
    $('list').innerHTML = html;
    const rn = $('rn');
    if (rn) { rn.focus(); rn.onkeydown = e => { if (e.key === 'Enter' && rn.value.trim()) { renameVal = rn.value; doRename(renameId); } }; }
  }
  window.reset = () => { resetModes(); };
  window.rowClick = id => { if (lpFired) { lpFired = false; return } if (menuId || renameId || armedId) { resetModes(); renderList(); return } cur = id; resetModes(); renderList(); renderChat(); closeSheet(); };
  window.toggleFav = id => { const s = sessions.find(x => x.id === id); s.fav = !s.fav; menuId = null; renderList(); };
  window.togglePin = id => { const s = sessions.find(x => x.id === id); s.pinned = !s.pinned; menuId = null; renderList(); };
  window.startRename = id => { const s = sessions.find(x => x.id === id); renameVal = s.title; renameId = id; menuId = null; renderList(); };
  window.doRename = id => { const v = renameVal.trim(); if (v) { sessions.find(x => x.id === id).title = v; if (id === cur) renderChat(); } resetModes(); renderList(); };
  window.arm = id => { armedId = id; menuId = null; renderList(); };
  window.doDelete = id => { sessions = sessions.filter(x => x.id !== id); if (cur === id) cur = sessions[0] ? sessions[0].id : null; resetModes(); renderList(); renderChat(); };
  let lpTimer = null, lpFired = false;
  window.lpStart = id => { lpFired = false; lpTimer = setTimeout(() => { lpTimer = null; lpFired = true; resetModes(); menuId = id; if (navigator.vibrate) navigator.vibrate(10); renderList(); }, 480) };
  window.lpCancel = () => { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null } };
  renderChat(); renderList();
</script>
</body>
</html>
