<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phrontis Mobile · 顶栏（额头）方案</title>
<style>
/* ============ 设计令牌（与 App dark 主题同源） ============ */
:root {
  --bg-primary: #1e1e1e; --bg-secondary: #252526; --bg-tertiary: #2d2d2d;
  --text-primary: #cccccc; --text-secondary: #969696; --text-muted: #6e6e6e;
  --accent: #007acc; --accent-hover: #1a8ad4; --accent-soft: rgba(0, 122, 204, .14);
  --border: #3c3c3c; --border-soft: rgba(60, 60, 60, .55);
  --green: #89d185; --red: #f14c4c; --blue: #3794ff; --amber: #cca700;
  --outside: #141516;
  --glass: rgba(37, 37, 38, .78);
  --spring: cubic-bezier(.23, 1, .32, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: var(--outside); color: var(--text-primary);
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  overflow-x: hidden;
}
button { font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.cap { max-width: 640px; margin: 84px auto 0; padding: 0 20px; }
.cap h1 { font-size: 14px; font-weight: 700; letter-spacing: .5px; }
.cap h1 em { font-style: normal; color: var(--accent-hover); margin-right: 8px; }
.cap p { font-size: 12px; color: var(--text-secondary); line-height: 1.7; margin-top: 5px; }
.cap .cost { color: var(--amber); }
.cap .hint { color: var(--text-muted); margin-top: 2px; }
.cap .good { color: var(--green); }

.proto-phone {
  position: relative; width: 390px; height: min(760px, calc(100dvh - 210px));
  min-height: 560px; margin: 18px auto 40px;
  border-radius: 26px; border: 1px solid var(--border); overflow: hidden;
  background: var(--bg-primary); box-shadow: 0 18px 60px rgba(0, 0, 0, .35);
  display: flex; flex-direction: column;
}

/* ============ 页面内容（与 tabbar 原型同源快照） ============ */
.ppages {
  position: absolute; top: 52px; bottom: 0; left: 0; right: 0;
  overflow-y: auto; padding: 0 14px 130px; overscroll-behavior: contain;
}
.pg-head { display: flex; align-items: center; margin: 10px 2px 12px; }
.pg-head .t { font-size: 16px; font-weight: 700; }
.pg-card { background: var(--bg-secondary); border: 1px solid var(--border-soft); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.pg-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; }
.pg-row + .pg-row { border-top: 1px solid var(--border-soft); }
.pg-ico { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-hover); display: flex; align-items: center; justify-content: center; flex: none; }
.pg-t { font-size: 13.5px; }
.pg-s { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
.pg-amt { margin-left: auto; font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pg-amt.income { color: var(--green); }
.pg-badge { margin-left: auto; font-size: 10.5px; padding: 2px 8px; border-radius: 999px; background: rgba(204, 167, 0, .16); color: var(--amber); }
.pg-badge.ok { background: rgba(137, 209, 133, .14); color: var(--green); }
.pg-chip { font-size: 10.5px; color: var(--text-muted); padding: 2px 8px; border: 1px solid var(--border-soft); border-radius: 999px; }
.pg-progress { height: 4px; border-radius: 2px; background: var(--bg-tertiary); margin: 0 2px 14px; overflow: hidden; }
.pg-progress i { display: block; height: 100%; width: 20%; background: var(--accent); border-radius: 2px; }
.pg-bubble { max-width: 78%; padding: 9px 12px; border-radius: 14px; font-size: 13px; line-height: 1.55; margin-bottom: 10px; }
.pg-bubble.ai { background: var(--bg-secondary); border: 1px solid var(--border-soft); border-top-left-radius: 4px; }
.pg-bubble.user { background: var(--accent-soft); color: var(--accent-hover); margin-left: auto; border-bottom-right-radius: 4px; }
.pg-compose { position: sticky; bottom: 0; display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.pg-compose .box { flex: 1; height: 38px; border-radius: 19px; background: var(--bg-secondary); border: 1px solid var(--border-soft); display: flex; align-items: center; padding: 0 14px; color: var(--text-muted); font-size: 12.5px; }
.pg-compose .mic { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
.pg-seg { display: inline-flex; background: var(--bg-tertiary); border-radius: 10px; padding: 2px; margin-left: auto; }
.pg-seg button { padding: 4px 10px; font-size: 11px; border-radius: 8px; color: var(--text-muted); }
.pg-seg button.on { background: var(--bg-primary); color: var(--text-primary); }
.pg-fab { position: absolute; right: 16px; bottom: 112px; width: 48px; height: 48px; border-radius: 16px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(0, 122, 204, .35); z-index: 4; }
.pg-week { display: flex; gap: 4px; margin-bottom: 12px; }
.pg-week b { flex: 1; text-align: center; font-weight: 400; font-size: 10px; color: var(--text-muted); padding: 6px 0; border-radius: 10px; }
.pg-week b i { display: block; font-style: normal; font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-top: 2px; }
.pg-week b.sel { background: var(--accent-soft); color: var(--accent-hover); }
.pg-week b.sel i { color: var(--accent-hover); }
.pg-label { font-size: 11px; color: var(--text-muted); margin: 14px 2px 8px; display: flex; align-items: center; gap: 8px; }
.pg-label::after { content: ""; flex: 1; height: 1px; background: var(--border-soft); }
.pg-ubars { display: flex; align-items: flex-end; gap: 3px; height: 74px; padding: 8px 2px 0; }
.pg-ubars i { flex: 1; background: var(--accent); opacity: .55; border-radius: 2px 2px 0 0; min-height: 3px; }
.pg-ubars i.hot { opacity: 1; }
.pg-input { height: 38px; border-radius: 11px; border: 1px solid var(--border-soft); background: var(--bg-tertiary); display: flex; align-items: center; padding: 0 12px; color: var(--text-muted); font-size: 12.5px; margin-bottom: 10px; }
.pg-btn { height: 40px; border-radius: 12px; background: var(--accent); color: #fff; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.pg-empty { text-align: center; color: var(--text-muted); font-size: 12px; padding: 24px 0; }

/* ============ 底栏（本原型固定「精修」，只变额头） ============ */
.tb { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; animation: barIn .24s var(--spring) both; }
@keyframes barIn { from { transform: translateY(14px); opacity: 0; } }
.tb-glass {
  display: flex; padding: 7px 8px 15px; position: relative;
  background: rgba(30, 30, 30, .82);
  -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4);
  border-top: 1px solid rgba(255, 255, 255, .055);
}
.tb-glass button {
  position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 0 3px; color: var(--text-muted); font-size: 10.5px; border-radius: 12px;
  transition: color .18s ease-out;
}
.tb-glass button svg { transition: transform .18s var(--spring); }
.tb-glass button:active svg { transform: scale(.86); }
.tb-glass button.on { color: var(--accent-hover); }
.tb-glass button.on svg { transform: translateY(-1px); }
.g-pill {
  position: absolute; top: 11px; left: 0; width: 48px; height: 31px; border-radius: 999px;
  background: var(--accent-soft); will-change: transform;
  transition: transform .26s var(--spring);
}

/* ============ 变体一「全剃」：无全局头，同步状态=异常才出现的右下浮标 ============ */
.bare { top: 0; padding-top: 14px; }
.sync-chip {
  position: absolute; right: 14px; bottom: 86px; z-index: 6;
  display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px;
  background: var(--glass); color: var(--text-secondary); font-size: 11.5px;
  -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);
  box-shadow: 0 8px 22px rgba(0, 0, 0, .4), inset 0 0 0 1px rgba(255, 255, 255, .07);
  transition: transform .2s var(--spring), box-shadow .2s;
  animation: barIn .3s var(--spring) both;
}
.sync-chip:active { transform: scale(.92); }
.sync-chip .sc-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.sync-chip.st-ok .sc-dot { background: var(--green); opacity: .55; }
.sync-chip.st-pend .sc-dot { background: var(--amber); }
.sync-chip.st-off .sc-dot { background: var(--red); }
.sync-chip.st-ok { padding: 0; width: 30px; height: 30px; justify-content: center; }
.sync-chip.st-ok { box-shadow: 0 4px 14px rgba(0, 0, 0, .3), inset 0 0 0 1px rgba(255, 255, 255, .05); }
.sync-chip.st-off { color: var(--red); }
.sync-chip.st-pend { color: var(--amber); }

/* ============ 变体二「薄一线」：52px 额头压成 36px 一线 ============ */
.thin {
  position: absolute; top: 0; left: 0; right: 0; height: 36px; z-index: 6;
  display: flex; align-items: center; gap: 7px; padding: 0 14px;
  background: var(--bg-primary); border-bottom: 1px solid var(--border-soft);
}
.tbrand { width: 8px; height: 8px; border-radius: 3px; background: var(--accent); flex: none; }
.tname { font-size: 12px; font-weight: 600; letter-spacing: .5px; }
.tspacer { flex: 1; }
.tsync {
  display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 999px;
  font-size: 10.5px; color: var(--text-muted); background: var(--bg-tertiary);
  transition: background .2s, color .2s;
}
.tsync .sc-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex: none; }
.tsync.st-pend { color: var(--amber); background: rgba(204, 167, 0, .14); }
.tsync.st-pend .sc-dot { background: var(--amber); }
.tsync.st-off { color: var(--red); background: rgba(241, 76, 76, .13); }
.tsync.st-off .sc-dot { background: var(--red); }
.thin-pages { top: 36px; }

/* ============ 变体三「随卷」：额头保留，滚动沉浮 ============ */
.imm {
  position: absolute; top: 0; left: 0; right: 0; height: 52px; z-index: 6;
  display: flex; align-items: center; gap: 8px; padding: 0 14px;
  background: rgba(30, 30, 30, .82);
  -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4);
  border-bottom: 1px solid rgba(255, 255, 255, .055);
  transition: transform .26s var(--spring);
}
.imm.hid { transform: translateY(-115%); transition: transform .24s ease-in; }
.imm .pbrand { font-size: 15px; font-weight: 700; letter-spacing: .4px; }
.imm .pbrand small { font-size: 9px; font-weight: 400; color: var(--text-muted); letter-spacing: 1px; }
.imm .pspacer { flex: 1; }
.ppill {
  display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px;
  border-radius: 16px; background: var(--bg-tertiary); border: 1px solid var(--border-soft);
  font-size: 11.5px; color: var(--text-secondary);
}
.ppill-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px rgba(137, 209, 133, .7); }
.imm-pages { top: 0; padding-top: 64px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ============ Picker（harness 规范，逐字复制） ============ */
.proto-picker {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px;
  border-radius: 999px; background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1;
  -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
}
.proto-picker-highlight {
  position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.12); will-change: transform;
}
.proto-picker[data-ready] .proto-picker-highlight {
  transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
.proto-picker-item {
  position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px;
  border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55);
  font: inherit; cursor: pointer; transition: color 150ms ease-out;
}
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
.proto-picker-item[data-active] { color: #fff; }
.proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
.proto-picker-replay { padding: 0 10px; font-size: 14px; }
.proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>
<body>
<div id="stage"></div>

<nav class="proto-picker" data-position="top" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">全剃</button>
  <button class="proto-picker-item">薄一线</button>
  <button class="proto-picker-item">随卷</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>

/* ================= 共享骨架（底栏固定「精修」，只变额头） ================= */
let page = 'ai'
let syncState = 0 // 0 正常 · 1 待同步 · 2 离线（演示用，点击循环）

const chipHtml = () => {
  if (syncState === 0) return '<span class="sc-dot"></span>'
  if (syncState === 1) return '<span class="sc-dot"></span>2 条待同步'
  return '<span class="sc-dot"></span>离线 · 点击查看'
}
const chipCls = () => 'sync-chip ' + (syncState === 0 ? 'st-ok' : syncState === 1 ? 'st-pend' : 'st-off')
const tsyncHtml = () => syncState === 1 ? '<span class="sc-dot"></span>2 条' : syncState === 2 ? '<span class="sc-dot"></span>离线' : '<span class="sc-dot"></span>'
const tsyncCls = () => 'tsync ' + (syncState === 0 ? '' : syncState === 1 ? 'st-pend' : 'st-off')

const tabbar = () => `
  <nav class="tb"><div class="tb-glass" id="gbar">
    <span class="g-pill" aria-hidden="true"></span>
    ${TABS.map(t => `<button data-nav="${t.id}" class="${t.id === page ? 'on' : ''}">${ic(t.ic, 21)}<span>${t.lb}</span></button>`).join('')}
  </div></nav>`

/* ================= 变体一「全剃」 ================= */
function vBare() {
  return {
    cap: { name: '全剃', axis: '全局头存在性=0——品牌行整个砍掉，同步状态降级为「异常才出现」的右下浮标', when: '额头两行里唯一有全局价值的只有同步状态，而它是「异常才值得关注」的信息：品牌在手机上是纯冗余（启动器+系统状态栏都在）', cost: '手动同步/连接入口只剩设置页；浮标正常态全隐后，新用户第一次找状态要去设置页', hint: '右下浮标点它循环演示 正常→待同步→离线（真机正常态可全隐）' },
    html: `
      <div class="ppages bare" id="ppages">${PAGES[page]()}</div>
      ${tabbar()}
      <button class="${chipCls()}" id="schip" title="同步状态（点击循环演示）">${chipHtml()}</button>`,
    init() {
      document.getElementById('schip').addEventListener('click', () => {
        syncState = (syncState + 1) % 3
        const c = document.getElementById('schip')
        c.className = chipCls()
        c.innerHTML = chipHtml()
      })
    },
    after() {},
  }
}

/* ================= 变体二「薄一线」 ================= */
function vThin() {
  return {
    cap: { name: '薄一线', axis: '全局头压缩——52px 额头压成 36px 一线：品牌缩成一颗方点+当前页名，右侧只留同步状态', when: '想保留一个全局常驻层（以后放全局搜索/快捷操作都行）又嫌现在笨重', cost: '省的高度有限（约 16px）；页面自己的头还在下面，叠层感只是减轻、没消失', hint: '右上小胶囊点它循环三态' },
    html: `
      <header class="thin"><span class="tbrand"></span><span class="tname" id="tname">${TABS.find(t => t.id === page).lb}</span>
        <span class="tspacer"></span>
        <button class="${tsyncCls()}" id="tsync" title="同步状态（点击循环演示）">${tsyncHtml()}</button>
      </header>
      <div class="ppages thin-pages" id="ppages">${PAGES[page]()}</div>
      ${tabbar()}`,
    init() {
      document.getElementById('tsync').addEventListener('click', () => {
        syncState = (syncState + 1) % 3
        const c = document.getElementById('tsync')
        c.className = tsyncCls()
        c.innerHTML = tsyncHtml()
      })
    },
    after() { document.getElementById('tname').textContent = TABS.find(t => t.id === page).lb },
  }
}

/* ================= 变体三「随卷」 ================= */
function vRoll() {
  return {
    cap: { name: '随卷', axis: '头部时序——额头原样保留但跟随滚动沉浮，机制与底栏「屏息」同款', when: '额头信息都想留，但刷账单、读长文时让它滚走，内容多一截', cost: '滚动时品牌/同步状态都不可见；将来配「屏息」底栏时两套沉浮要一起动（正好同机制）', hint: '在页面里上下滚动，看额头沉浮' },
    html: `
      <header class="imm" id="immbar">
        <span class="pbrand">Phrontis <small>MOBILE</small></span>
        <span class="pspacer"></span>
        <button class="ppill"><span class="ppill-dot"></span>已连接电脑</button>
      </header>
      <div class="ppages imm-pages" id="ppages">${PAGES[page]()}</div>
      ${tabbar()}`,
    init() {
      const pages = document.getElementById('ppages')
      const bar = document.getElementById('immbar')
      let last = 0
      pages.addEventListener('scroll', () => {
        const st = pages.scrollTop
        if (st > last + 6 && st > 60) bar.classList.add('hid')
        else if (st < last - 4 || st < 60) bar.classList.remove('hid')
        last = st
      }, { passive: true })
    },
    after() { document.getElementById('immbar').classList.remove('hid') },
  }
}

/* ================= 装配 ================= */
const variants = [vBare, vThin, vRoll]

function placePill() {
  const bar = stage.querySelector('#gbar')
  if (!bar) return
  const pill = bar.querySelector('.g-pill')
  const btn = bar.querySelector('button.on')
  if (!pill || !btn) return
  pill.style.transform = `translateX(${btn.offsetLeft + (btn.offsetWidth - pill.offsetWidth) / 2}px)`
}

function go(id) {
  page = id
  const host = document.getElementById('ppages')
  if (host) host.innerHTML = PAGES[page]()
  stage.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === page))
  variants[cur]().after?.()
  placePill()
}

const stage = document.getElementById('stage')
const picker = document.querySelector('.proto-picker')
const highlight = picker.querySelector('.proto-picker-highlight')
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')]
const replay = picker.querySelector('.proto-picker-replay')
let cur = 0

function moveHighlight() {
  const el = items[cur]
  highlight.style.width = el.offsetWidth + 'px'
  highlight.style.transform = `translateX(${el.offsetLeft}px)`
}

function mount(i) {
  stage.innerHTML = ''
  requestAnimationFrame(() => {
    const v = variants[i]()
    stage.innerHTML = `
      <div class="cap">
        <h1><em>${v.cap.name}</em>${v.cap.axis}</h1>
        <p>${v.cap.when}</p>
        <p class="cost">代价：${v.cap.cost}</p>
        <p class="hint">${v.cap.hint} · 底栏固定用「精修」，选定后与任一底栏方案自由组合</p>
      </div>
      <div class="proto-phone has-tb">${v.html}</div>`
    stage.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => go(b.dataset.nav)))
    v.init?.()
    requestAnimationFrame(placePill)
  })
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return
  cur = i
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i)
    if (j === i) el.setAttribute('aria-current', 'true')
    else el.removeAttribute('aria-current')
  })
  moveHighlight()
  const url = new URL(location)
  url.searchParams.set('v', i + 1)
  history.replaceState(null, '', url)
  mount(i)
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)))
replay.addEventListener('click', () => mount(cur))
window.addEventListener('resize', () => { moveHighlight(); placePill() })

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return
  if (e.metaKey || e.ctrlKey || e.altKey) return
  const num = parseInt(e.key, 10)
  if (num >= 1 && num <= variants.length) setActive(num - 1)
  else if (e.key === 'ArrowRight') setActive((cur + 1) % variants.length)
  else if (e.key === 'ArrowLeft') setActive((cur - 1 + variants.length) % variants.length)
  else if (e.key === 'r' || e.key === 'R') mount(cur)
})

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1)
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')))
</script>
