<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phrontis Mobile · AI 配置原型</title>
<style>
/* ===== 手机端同款令牌（深色） ===== */
:root {
  --bg-primary: #1e1e1e; --bg-secondary: #252526; --bg-tertiary: #2d2d2d; --bg-hover: #2a2d2e;
  --text-primary: #cccccc; --text-secondary: #969696; --text-muted: #6e6e6e;
  --accent: #007acc; --accent-hover: #1a8ad4; --accent-soft: rgba(0, 122, 204, .14);
  --border: #3c3c3c; --border-soft: rgba(60, 60, 60, .55);
  --green: #89d185; --red: #f14c4c; --amber: #cca700;
  --outside: #141516; --glass: rgba(37, 37, 38, .82);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: var(--outside); color: var(--text-primary);
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
button { font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; }
input, select { font-family: inherit; color: var(--text-primary); }
code, .mono { font-family: Consolas, "JetBrains Mono", monospace; }

/* ===== 手机壳 ===== */
.phone {
  width: 390px; height: min(844px, calc(100vh - 24px));
  background: var(--bg-primary); border-radius: 26px; border: 1px solid var(--border);
  overflow: hidden; position: relative; display: flex; flex-direction: column;
  box-shadow: 0 18px 60px rgba(0, 0, 0, .5);
}
.page { flex: 1; overflow-y: auto; padding: 18px 16px 40px; overscroll-behavior: contain; }
.pg-head { margin-bottom: 4px; }
.pg-head .t { font-size: 26px; font-weight: 700; letter-spacing: .3px; }
.c-meta { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }
.c-meta .mdot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }
.set-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); letter-spacing: 1px; margin: 20px 0 8px; }
.card { background: var(--bg-primary); border: 1px solid var(--border-soft); border-radius: 14px; padding: 14px; }
.card.dim { opacity: .45; pointer-events: none; }

/* ===== 当前配置摘要卡 ===== */
.cur { display: flex; align-items: center; gap: 12px; }
.cur .ico { width: 42px; height: 42px; border-radius: 12px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; flex: none; }
.cur .ico svg { width: 20px; height: 20px; }
.cur .info { flex: 1; min-width: 0; }
.cur .n { font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.cur .pdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.cur .s { font-size: 11.5px; color: var(--text-secondary); margin-top: 4px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.cur .s .st { display: inline-flex; align-items: center; gap: 4px; }
.cur .s .st::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--text-muted); }
.cur .s .st.ok::before { background: var(--green); }
.cur .s .st.bad::before { background: var(--red); }
.cur .s .st.ok { color: var(--green); }
.cur .s .st.bad { color: var(--red); }
.btn-row { display: flex; gap: 10px; margin-top: 14px; }
.btn-p { flex: 1; height: 42px; border-radius: 11px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; transition: transform .1s, opacity .15s; }
.btn-p:active { transform: scale(.97); }
.btn-p:disabled { opacity: .4; }
.btn-g { height: 42px; padding: 0 16px; border-radius: 11px; border: 1px solid var(--border); color: var(--text-secondary); font-size: 13.5px; transition: transform .1s; }
.btn-g:active { transform: scale(.97); }
.hint { font-size: 11.5px; color: var(--text-muted); line-height: 1.6; margin-top: 10px; }

/* ===== 抽屉 ===== */
.backdrop { position: absolute; inset: 0; z-index: 40; background: rgba(0, 0, 0, .45); opacity: 0; pointer-events: none; transition: opacity .18s ease-out; }
.backdrop.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 86%;
  background: var(--bg-secondary); border-radius: 20px 20px 0 0; border-top: 1px solid var(--border-soft);
  transform: translateY(102%); transition: transform .26s cubic-bezier(.23, 1, .32, 1);
  display: flex; flex-direction: column;
}
.sheet.on { transform: none; }
.sh-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; flex: none; }
.sh-head .bt { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); margin-left: -6px; }
.sh-head .bt:active { background: var(--bg-tertiary); }
.sh-head .tt { font-size: 15px; font-weight: 700; flex: 1; text-align: center; }
.sh-head .x { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
.sh-body { overflow-y: auto; padding: 2px 16px 22px; }

/* ===== 预设选择网格 ===== */
.pk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pk-card {
  display: flex; align-items: center; gap: 9px; padding: 10px 11px; text-align: left;
  border-radius: 11px; border: 1px solid var(--border); background: var(--bg-primary);
  transition: border-color .14s, background .14s, transform .1s;
}
.pk-card:active { transform: scale(.96); }
.pk-card:hover { border-color: var(--accent); }
.pk-card .pdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.pk-card .pn { font-size: 12.5px; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pk-card .ps { font-size: 10.5px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pk-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
.pk-foot .l { font-size: 11.5px; color: var(--text-secondary); }
.pk-foot .r { font-size: 11px; color: var(--text-muted); }

/* ===== 添加表单 ===== */
.filled { border: 1px solid var(--border-soft); border-radius: 11px; padding: 10px 12px; margin-bottom: 12px; background: var(--bg-primary); }
.filled .h { font-size: 11px; color: var(--text-muted); margin-bottom: 7px; display: flex; align-items: center; gap: 6px; }
.filled .r { display: flex; gap: 8px; font-size: 11.5px; padding: 3px 0; align-items: baseline; }
.filled .r .k { color: var(--text-muted); flex: none; width: 58px; }
.filled .r .v { color: var(--text-secondary); word-break: break-all; }
.badge { display: inline-block; padding: 1px 6px; border-radius: 5px; font-size: 10px; border: 1px solid; }
.badge.doc { color: var(--green); border-color: rgba(137, 209, 133, .4); }
.badge.unv { color: var(--amber); border-color: rgba(204, 167, 0, .4); }
.frow { margin: 12px 0; }
.frow label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 7px; }
.frow input, .frow select {
  width: 100%; background: var(--bg-tertiary); border: 1px solid var(--border-soft); border-radius: 11px;
  padding: 11px 13px; font-size: 15px; outline: none; transition: border-color .15s;
}
.frow input:focus, .frow select:focus { border-color: var(--accent); }
.frow input.err { border-color: var(--red); }
.kwrap { position: relative; }
.kwrap .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); padding: 7px; color: var(--text-muted); display: flex; }
.kwrap .eye:active { color: var(--text-primary); }
.mrow { display: flex; gap: 8px; }
.mrow select, .mrow input { flex: 1; min-width: 0; }
.mfetch {
  flex: none; height: 43px; padding: 0 13px; border-radius: 11px; border: 1px solid var(--border);
  color: var(--text-secondary); font-size: 12.5px; display: flex; align-items: center; gap: 6px;
  transition: transform .1s;
}
.mfetch:active { transform: scale(.95); }
.mfetch.busy { color: var(--accent-hover); }
.mcnt { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
.spin { width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent-hover); border-radius: 50%; animation: sp .7s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.advt { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text-muted); padding: 4px 0; }
.advt .cv { transition: transform .16s; }
.advt.open .cv { transform: rotate(90deg); }
.adv { display: none; border-top: 1px solid var(--border-soft); margin-top: 8px; padding-top: 2px; }
.adv.on { display: block; animation: fadein .2s ease-out; }
@keyframes fadein { from { opacity: 0; transform: translateY(-3px); } }
.test-out { margin-top: 10px; border-radius: 10px; padding: 10px 12px; font-size: 12px; line-height: 1.55; display: none; animation: fadein .22s ease-out; }
.test-out.on { display: block; }
.test-out.ok { background: rgba(137, 209, 133, .1); border: 1px solid rgba(137, 209, 133, .3); color: var(--green); }
.test-out.bad { background: rgba(241, 76, 76, .08); border: 1px solid rgba(241, 76, 76, .3); color: var(--red); }
.test-out .lat { color: var(--text-secondary); }
.sh-foot { display: flex; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border-soft); }

/* ===== Toast ===== */
.toast {
  position: absolute; left: 50%; bottom: 88px; transform: translateX(-50%) translateY(8px); z-index: 60;
  background: var(--glass); border: 1px solid var(--border-soft); border-radius: 12px; padding: 9px 16px;
  font-size: 12.5px; color: var(--text-primary); opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .35); white-space: nowrap;
}
.toast.on { opacity: 1; transform: translateX(-50%); }

/* 桌面查看辅助：页面底下说明条 */
.note { position: fixed; left: 12px; bottom: 10px; font-size: 11px; color: #555; font-family: Consolas, monospace; }
@media (max-width: 430px) { .note { display: none; } .phone { width: 100vw; height: 100dvh; border-radius: 0; border: none; } }
</style>
</head>
<body>
<div class="phone">
  <div class="page">
    <div class="pg-head"><div class="t">设置</div></div>
    <div class="c-meta"><span class="mdot"></span>未配对电脑 · 点此去设置</div>

    <div class="set-label">AI 模型（手机直连）</div>
    <div class="card">
      <div class="cur">
        <div class="ico" id="curIco"></div>
        <div class="info">
          <div class="n"><span class="pdot" id="curDot" style="background:#4d6bfe"></span><span id="curName">DeepSeek</span></div>
          <div class="s"><span class="mono" id="curModel">deepseek-chat</span><span class="st" id="curSt">未测试</span></div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-p" id="btnTest">测试连接</button>
        <button class="btn-g" id="btnChange">更换供应商</button>
      </div>
      <div class="hint" id="curHint">Key 只存手机本地，不上行不同步。换供应商不会丢聊天记录。</div>
    </div>

    <div class="set-label">同步</div>
    <div class="card dim"><div style="font-size:13px;color:var(--text-secondary)">未配对电脑 —— 配对后记账数据与电脑双向同步</div></div>
    <div class="set-label">外观</div>
    <div class="card dim"><div style="font-size:13px;color:var(--text-secondary)">深色 · 主题网格</div></div>
  </div>

  <div class="backdrop" id="bd"></div>
  <div class="sheet" id="sheet">
    <div class="sh-head">
      <button class="bt" id="shBack" style="visibility:hidden"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="tt" id="shTitle">选择供应商</div>
      <button class="x" id="shX"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="sh-body" id="shBody"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<div class="note">Phrontis Mobile · AI 配置原型（提案，mock 数据）— E:\Projects\Phrontis-mobile\prototype\ai-config.html</div>

<script>
/* ===== 预设数据：与桌面 src/lib/llmPresets.ts 同源（逐项搬运） ===== */
const PRESETS = [
  { id: 'deepseek', name: 'DeepSeek', sub: '官方 API', base: 'https://api.deepseek.com/v1', color: '#4d6bfe',
    models: ['deepseek-chat', 'deepseek-reasoner'] },
  { id: 'qwen', name: '通义千问', sub: '阿里云 DashScope', base: 'https://dashscope.aliyuncs.com/compatible-mode/v1', color: '#615ced',
    models: ['qwen3-235b-a22b', 'qwen-plus', 'qwen-flash', 'qwen-turbo', 'qwen-max'] },
  { id: 'doubao', name: '豆包 · 火山方舟', sub: '字节跳动', base: 'https://ark.cn-beijing.volces.com/api/v3', color: '#1664ff',
    unverified: true, modelInput: 'endpoint',
    modelHint: '该平台没有可下拉的模型清单，「模型」一栏需填写接入点 ID（以 ep- 开头）：请在火山方舟控制台 →「在线推理」中复制接入点 ID。较新的接入点也接受模型名。' },
  { id: 'kimi', name: 'Kimi', sub: '月之暗面', base: 'https://api.moonshot.cn/v1', color: '#0b0b0b',
    models: ['kimi-k2-0905-preview', 'kimi-k2-turbo-preview', 'kimi-latest', 'moonshot-v1-128k', 'moonshot-v1-32k', 'moonshot-v1-8k'] },
  { id: 'glm', name: '智谱 GLM', sub: 'bigmodel.cn', base: 'https://open.bigmodel.cn/api/paas/v4', color: '#3859ff',
    models: ['glm-4.6', 'glm-4.5', 'glm-4.5-air', 'glm-4.5-flash'] },
  { id: 'opencode', name: 'opencode', sub: 'opencode.ai 网关', base: 'https://opencode.ai/inference/go/v1', color: '#9a9a9a',
    header: { 'x-opencode-session': '（按对话自动带上）' }, srcConfig: true,
    modelHint: '该端点同时提供三种协议（chat / messages / responses），协议属于模型自身的属性；手机端按当前所选模型自动匹配。',
    models: ['qwen3-coder', 'claude-sonnet-4-5', 'gpt-5-codex', 'gemini-2.5-pro', 'grok-code-fast-1', 'kimi-k2-0905-preview', 'deepseek-v3.1', 'glm-4.6'] },
  { id: 'ollama', name: 'Ollama 本地', sub: '本机运行，无需 API Key', base: 'http://localhost:11434', color: '#8a8a8a', local: true,
    models: ['qwen3:8b', 'llama3.2:3b', 'deepseek-r1:7b', 'phi4'] },
  { id: 'custom', name: '自定义 / 网关', sub: '任意兼容端点', base: '', color: '#6a6a6a',
    models: ['gpt-4o-mini', 'claude-3-5-haiku', 'deepseek-chat'] },
]
const presetById = id => PRESETS.find(p => p.id === id)
const addChip = p => p.local ? '本地服务，无需 API Key' : (p.modelInput === 'endpoint' ? '需填 API Key 与接入点 ID' : '仅需填写 API Key')

/* ===== 状态 ===== */
const state = {
  cfg: { preset: 'deepseek', name: 'DeepSeek', model: 'deepseek-chat', baseUrl: 'https://api.deepseek.com/v1', key: '' },
  tested: null,   // null | { ok, ms, model }
  step: 'pick',   // pick | form
  form: null,     // 当前表单的预设 id
  fetched: null,  // 表单内是否已拉到清单
}

/* ===== 工具 ===== */
const $ = id => document.getElementById(id)
const sleep = ms => new Promise(r => setTimeout(r, ms))
let toastTimer
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on')
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2000)
}
const SPARK = '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-hover)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/><path d="M19 15l.9 2.4L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.6L19 15z"/></svg>'

/* ===== 摘要卡渲染 ===== */
function renderCur() {
  const c = state.cfg
  $('curIco').innerHTML = SPARK
  $('curDot').style.background = presetById(c.preset)?.color || '#6a6a6a'
  $('curName').textContent = c.name
  $('curModel').textContent = c.model
  const st = $('curSt')
  if (state.tested === null) { st.className = 'st'; st.textContent = '未测试' }
  else if (state.tested.ok) { st.className = 'st ok'; st.textContent = `可用 · ${state.tested.ms}ms` }
  else { st.className = 'st bad'; st.textContent = '连接失败' }
}

/* ===== 抽屉 ===== */
function openSheet() { $('bd').classList.add('on'); $('sheet').classList.add('on') }
function closeSheet() { $('bd').classList.remove('on'); $('sheet').classList.remove('on') }
function showStep(step) {
  state.step = step
  $('shBack').style.visibility = step === 'form' ? 'visible' : 'hidden'
  $('shTitle').textContent = step === 'pick' ? '选择供应商' : `添加「${presetById(state.form).name}」`
  $('shBody').innerHTML = step === 'pick' ? renderPicker() : renderForm()
  if (step === 'form') wireForm()
}

/* ===== 步骤 1：预设网格（桌面同款：品牌色点 + 名称 + 副标题） ===== */
function renderPicker() {
  return `
    <div class="pk-grid">${PRESETS.map(p => `
      <button class="pk-card" data-pick="${p.id}" title="${p.base || '自定义端点：地址与类型自己填'}">
        <span class="pdot" style="background:${p.color}"></span>
        <span style="min-width:0"><span class="pn">${p.name}</span><span class="ps">${p.sub}</span></span>
      </button>`).join('')}
    </div>
    <div class="pk-foot">
      <span class="l">选中预设 → 只差粘一个 Key</span>
      <span class="r">地址 / 协议 / 会话头由预设带好</span>
    </div>`
}

/* ===== 步骤 2：添加表单 ===== */
function renderForm() {
  const p = presetById(state.form)
  const filledRows = [
    ['接口地址', p.base || '（自定义，在下方高级里填）'],
    ['协议', p.local ? 'Ollama 原生' : 'OpenAI 兼容'],
    ...(p.header ? [['会话头', `${Object.keys(p.header)[0]}: ${Object.values(p.header)[0]}`]] : []),
  ]
  return `
    <div class="filled">
      <div class="h">预设替你填好的（可改）</div>
      ${filledRows.map(([k, v]) => `<div class="r"><span class="k">${k}</span><span class="v mono">${v}</span></div>`).join('')}
      ${p.srcConfig ? '<div class="r"><span class="k"></span><span><span class="badge doc">按官方文档</span></span></div>' : ''}
      ${p.unverified ? '<div class="r"><span class="k"></span><span><span class="badge unv">地址未经在线核实</span> 测试连接后再用</span></div>' : ''}
    </div>

    <div class="frow">
      <label>${p.local ? 'API Key（本地可留空）' : 'API Key'}</label>
      <div class="kwrap">
        <input id="fKey" type="password" placeholder="${p.local ? '本地模型无需 API Key' : 'sk-…（加密存手机，之后不可回读）'}" ${p.local ? 'disabled' : ''}>
        ${p.local ? '' : `<button class="eye" id="fEye" title="显示/隐藏"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>`}
      </div>
    </div>

    <div class="frow">
      <label>${p.modelInput === 'endpoint' ? '接入点 ID' : '模型'}</label>
      ${p.modelInput === 'endpoint'
        ? `<input id="fModel" class="mono" placeholder="ep-2026…" spellcheck="false"><div class="mcnt">${p.modelHint}</div>`
        : `<div class="mrow" id="mrow">
             <select id="fModelSel">${p.models.map(m => `<option ${m === p.models[0] ? 'selected' : ''}>${m}</option>`).join('')}</select>
             <button class="mfetch" id="fFetch"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>拉取清单</button>
           </div>
           <div class="mcnt" id="mCnt">也可以拉取端点的模型清单来选</div>`}
    </div>

    <div class="advt" id="advT"><svg class="cv" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>高级（接口地址 / 协议 / 自定义请求头）</div>
    <div class="adv" id="adv">
      <div class="frow"><label>接口地址</label><input id="fBase" class="mono" value="${p.base}" placeholder="https://your-host/v1" spellcheck="false"></div>
      <div class="frow"><label>协议类型</label>
        <select id="fType"><option>OpenAI 兼容</option><option>Ollama 原生</option></select>
      </div>
      <div class="frow"><label>自定义请求头（JSON）</label><input id="fHead" class="mono" placeholder='{"头名":"值"}' spellcheck="false"></div>
    </div>

    <div class="test-out" id="tOut"></div>

    <div class="sh-foot">
      <button class="btn-g" id="fTest" style="flex:1">测试连接</button>
      <button class="btn-p" id="fSave" style="flex:1">保存</button>
    </div>`
}

/* ===== 表单交互 ===== */
function wireForm() {
  const p = presetById(state.form)
  $('fEye')?.addEventListener('click', () => {
    const k = $('fKey'); k.type = k.type === 'password' ? 'text' : 'password'
  })
  $('advT').addEventListener('click', () => { $('advT').classList.toggle('open'); $('adv').classList.toggle('on') })

  /* 拉取模型清单（mock：700ms 后出现下拉，与桌面 GET /models / Ollama /api/tags 同一手法） */
  $('fFetch')?.addEventListener('click', async () => {
    const b = $('fFetch'); if (b.classList.contains('busy')) return
    b.classList.add('busy')
    b.innerHTML = '<span class="spin"></span>拉取中'
    await sleep(700)
    b.classList.remove('busy')
    b.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>重新拉取'
    const sel = document.createElement('select')
    sel.id = 'fModelSel'
    sel.innerHTML = p.models.map(m => `<option>${m}</option>`).join('')
    const old = $('fModelSel')
    old.replaceWith(sel)
    $('mCnt').textContent = `已拉取 ${p.models.length} 个模型（GET ${p.base}/models）`
    toast('清单已更新')
  })

  /* 测试连接（mock：空 Key 报错；非空 200~400ms 成功） */
  $('fTest').addEventListener('click', async () => {
    const out = $('tOut'); const key = $('fKey')?.value.trim()
    if (!p.local && !key) {
      $('fKey')?.classList.add('err')
      out.className = 'test-out on bad'
      out.textContent = '先填 API Key 再测试。'
      return
    }
    $('fKey')?.classList.remove('err')
    const btn = $('fTest'); btn.disabled = true; btn.textContent = '测试中…'
    out.className = 'test-out on'
    out.style.cssText = 'display:block;background:var(--bg-tertiary);border:1px solid var(--border-soft);color:var(--text-muted)'
    out.textContent = '正在连接端点，发一条 1 token 的探测消息…'
    await sleep(800)
    const ms = 180 + Math.floor(Math.random() * 220)
    const model = p.modelInput === 'endpoint' ? ($('fModel')?.value.trim() || '（接入点）') : ($('fModelSel')?.value || p.models[0])
    btn.disabled = false; btn.textContent = '测试连接'
    out.className = 'test-out on ok'
    out.innerHTML = `连接成功 · <span class="lat">${ms}ms</span> · ${model} 应答正常。Key 有效，可以保存。`
  })

  /* 保存 */
  $('fSave').addEventListener('click', () => {
    const key = $('fKey')?.value.trim() ?? ''
    if (!p.local && !key) {
      $('fKey')?.classList.add('err')
      const out = $('tOut'); out.className = 'test-out on bad'; out.textContent = '还差一个 API Key。'
      return
    }
    const base = ($('fBase')?.value.trim() || p.base)
    let model
    if (p.modelInput === 'endpoint') {
      model = $('fModel').value.trim()
      if (!model) { $('fModel').classList.add('err'); const out = $('tOut'); out.className = 'test-out on bad'; out.textContent = '火山方舟需要接入点 ID（ep- 开头）。'; return }
    } else {
      model = $('fModelSel')?.value || p.models[0]
    }
    state.cfg = { preset: p.id, name: p.name, model, baseUrl: base, key }
    state.tested = null
    renderCur(); closeSheet()
    toast(`已保存 ${p.name} · 只在本机`)
  })
}

/* ===== 全局事件 ===== */
$('shBody').addEventListener('click', e => {
  const card = e.target.closest('[data-pick]')
  if (card) { state.form = card.dataset.pick; showStep('form') }
})
$('shBack').addEventListener('click', () => showStep('pick'))
$('shX').addEventListener('click', closeSheet)
$('bd').addEventListener('click', closeSheet)
$('btnChange').addEventListener('click', () => { showStep('pick'); openSheet() })

/* 测试连接（摘要卡上，对已保存配置） */
$('btnTest').addEventListener('click', async () => {
  const b = $('btnTest'); b.disabled = true; b.textContent = '测试中…'
  await sleep(800)
  const ms = 180 + Math.floor(Math.random() * 220)
  state.tested = { ok: true, ms }
  renderCur()
  b.disabled = false; b.textContent = '测试连接'
  toast(`连接成功 · ${ms}ms`)
})

renderCur()
</script>
</body>
</html>
